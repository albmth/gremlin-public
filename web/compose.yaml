# The website's local storage for ./web/dev.sh: DynamoDB Local and MinIO on named volumes, so
# history survives restarts (the contract suite's emulators are in-memory and shared by tests).
# Ports bind to loopback only.
name: gremlin-web
services:
  dynamodb:
    image: amazon/dynamodb-local:3.1.0@sha256:7ef4a2c45b58c2901e70a4f28e0953a422c2c631baaaf5e2c15e0805740c7752
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/data"]
    # A new named volume is owned by root; the image's own user could not write to it.
    user: root
    volumes: ["dynamodb:/data"]
    ports: ["127.0.0.1:8002:8000"]
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: gremlinlocal
      MINIO_ROOT_PASSWORD: gremlinlocalsecret
    volumes: ["minio:/data"]
    ports: ["127.0.0.1:9102:9000"]
volumes:
  dynamodb:
  minio:
