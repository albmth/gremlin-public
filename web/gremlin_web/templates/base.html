<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Adding to the Slop</title>
  <meta name="description" content="Put a character from your photo into a short video clip, keeping the clip's motion, camera and scene.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="{{ asset('favicon.ico') }}" sizes="16x16 32x32 48x48" type="image/vnd.microsoft.icon">
  <link rel="icon" href="{{ asset('icon.svg') }}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{ asset('apple-touch-icon.png') }}" sizes="180x180">
  <link rel="stylesheet" href="{{ asset('site.css') }}">
  <script type="module" src="{{ asset('app.js') }}"></script>
  <script type="module" src="{{ asset('info.js') }}"></script>
</head>
<body data-page="{% block page %}{% endblock %}">
  <header class="top">
    <a class="quota" href="/" tabindex="-1" data-quota hidden>
      <span class="quota-bars" aria-hidden="true">{% for _ in range(10) %}<span></span>{% endfor %}</span>
      <span class="quota-text" aria-hidden="true" data-quota-text></span>
    </a>
    <span class="status" data-status hidden></span>
    <button class="info-toggle" type="button" aria-expanded="false" aria-controls="info" aria-label="About" title="About" data-info-toggle>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6"/><circle cx="12" cy="7.5" r=".75" fill="currentColor" stroke="none"/></svg>
    </button>
  </header>
  {% include "info.html" %}
  <main id="main">
    {% block main %}{% endblock %}
  </main>
</body>
</html>
