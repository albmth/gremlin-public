[project]
name = "gremlin-web"
version = "0.1.0"
description = "Gremlin's public web interface: upload, generate, track and keep videos"
requires-python = ">=3.12,<3.13"
# What the API function needs; the media and detection stack is the worker group below.
dependencies = [
  "boto3>=1.40",
  "fastapi>=0.138.0",
  "jinja2>=3.1.6",
  "mangum>=0.19.0",
  "pydantic-settings>=2.14.2",
  "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "playwright>=1.64.1",
    "pytest>=9.1.1",
    "uvicorn>=0.49.0",
]
# Only the worker function decodes media and runs the subject detector (web/Makefile).
worker = [
  "av==19.0.1",
  "numpy>=2.3",
  "onnxruntime==1.31.1",
  "pillow==13.0.0",
  "pillow-heif>=1.1.0",
]

[tool.uv]
package = false
default-groups = ["dev", "worker"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
