[project]
name = "gremlin-control"
version = "0.1.0"
description = "Gremlin's Imprint control API on AWS Lambda, DynamoDB and S3"
requires-python = ">=3.12,<3.13"
dependencies = [
  "av==19.0.1",
  "boto3>=1.40",
  "fastapi>=0.138.0",
  "mangum>=0.19.0",
  "pillow==13.0.0",
  "pydantic-settings>=2.14.2",
  "requests>=2.34.2",
]

[dependency-groups]
dev = ["pytest>=9.1.1", "uvicorn>=0.49.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
